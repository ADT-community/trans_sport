name: Payments API tests

on:
  push:
    paths: ["server/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
        working-directory: server
