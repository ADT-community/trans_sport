<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>trans_sport — Minibus app</title>
<meta name="description" content="See minibuses near you, pay by mobile money and share your trip. Drivers and owners run their fleet from their phones.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- ============ PASSENGER ============ -->
  <section class="view active" id="view-ride" aria-label="Ride">
    <div id="rideMap" class="map"></div>
    <div class="topbar">
      <div class="brand">trans<span>_</span>sport</div>
      <label class="chip select-chip">
        <select id="routeFilter" aria-label="Filter by route">
          <option value="">All routes</option>
        </select>
      </label>
    </div>
    <button class="locate" id="locate" aria-label="Show my location">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    </button>
    <div class="sheet" id="rideSheet">
      <div class="grab"></div>
      <div id="rideList">
        <h2 class="sheet-title">Minibuses near you</h2>
        <p class="sheet-sub" id="rideWhere">Using a default spot in Lagos</p>
        <div class="list" id="busList"></div>
      </div>
      <div id="rideDetail" hidden></div>
    </div>
  </section>

  <!-- ============ DRIVER ============ -->
  <section class="view" id="view-drive" aria-label="Drive">
    <div class="page">
      <header class="page-head">
        <div class="brand">trans<span>_</span>sport</div>
        <span class="pill" id="driverMode">Driver</span>
      </header>
      <div class="card vehicle-card">
        <div>
          <p class="muted small">Your vehicle</p>
          <h2 id="dPlate">LND 482 XA</h2>
          <p id="dRoute" class="route-name"></p>
        </div>
        <div class="route-dot" id="dRouteDot"></div>
      </div>

      <button class="shift-btn" id="shiftBtn">Start shift</button>
      <p class="gps" id="gpsStatus">GPS off. Your location is only shared while you're on shift.</p>

      <div class="stats" id="driverStats">
        <div class="stat"><span class="k">Trips</span><span class="v" id="dTrips">0</span></div>

  <!-- ============ OWNER ============ -->
  <section class="view" id="view-owner" aria-label="Owner">
    <div class="map" id="ownerMap"></div>
    <div class="owner-dashboard">
      <div class="owner-summary">
        <div class="owner-key">
          <div class="value" id="todayEarnings">$0</div>
          <div class="label">Today's Earnings</div>
        </div>
        <div class="owner-key">
          <div class="value" id="activeVehicles">0</div>
          <div class="label">Active Vehicles</div>
        </div>
      </div>
      <div class="owner-vehicles">
        <h2 class="sheet-title">Your Fleet</h2>
        <div class="list" id="ownerVehicleList"></div>
      </div>
    </div>
  </section>

</div>
</body>
</html>
